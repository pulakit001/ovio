name: Release

# Builds installers for macOS (arm64 + x64), Windows (x64) and Linux (x64)
# and publishes them to a single GitHub Release.
#
# macOS signing / notarization is automatic:
#  - Secrets present (MAC_CSC_LINK + Apple creds) → Developer-ID signed AND
#    notarized, then verified with a hard gate before upload. No Gatekeeper
#    dialog for users.
#  - No secrets → ad-hoc signed build. Users see the one-time "Apple could
#    not verify" dialog and open via System Settings → Privacy & Security →
#    Open Anyway (documented in the in-app updater popup).
#
# Windows builds are unsigned by default (SmartScreen shows a one-time
# "Windows protected your PC" → More info → Run anyway). Add WIN_CSC_* secrets
# to sign them and remove that prompt.
#
# Linux ships as AppImage (runs anywhere) + .deb (Debian/Ubuntu).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer (vite)
        run: npm run build

      - name: Build, sign (and notarize if secrets exist)
        run: |
          [ -z "$CSC_LINK" ] && unset CSC_LINK || true
          [ -z "$CSC_KEY_PASSWORD" ] && unset CSC_KEY_PASSWORD || true
          [ -z "$APPLE_ID" ] && unset APPLE_ID || true
          [ -z "$APPLE_APP_SPECIFIC_PASSWORD" ] && unset APPLE_APP_SPECIFIC_PASSWORD || true
          [ -z "$APPLE_TEAM_ID" ] && unset APPLE_TEAM_ID || true
          npx electron-builder --mac --publish never
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Smoke-check the packaged apps
        run: |
          for APP in "release/mac-arm64/Ovio.app" "release/mac/Ovio.app"; do
            [ -d "$APP" ] || { echo "✖ missing build: $APP"; exit 1; }
            npx --yes @electron/asar list "${APP}/Contents/Resources/app.asar" | grep -q "dist/index.html" \
              || { echo "✖ dist/index.html is NOT in ${APP} — the app would open blank."; exit 1; }
            find "${APP}" -name "llama-addon.node" | grep -q "@node-llama-cpp" \
              || { echo "✖ local AI addon is missing from ${APP}."; exit 1; }
            echo "✔ dist/index.html present in ${APP}."
          done

      - name: Verify signing (hard gate when a cert is configured)
        run: |
          if [ -n "$CSC_LINK" ]; then export REQUIRE_NOTARIZED=1; fi
          node scripts/verify-release-signing.cjs
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}

      - name: Upload macOS artifacts
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          gh release view "v$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "v$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "Ovio v$TAG" --generate-notes
          gh release upload "v$TAG" release/*.dmg release/*.zip release/*.blockmap \
            --repo "$GITHUB_REPOSITORY" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The Homebrew cask is what the website's install command resolves, so it
      # has to name this release or new users get the previous build. It was
      # left behind once (cask 1.3.7 while 1.4.x shipped), so bump it here.
      # Uploads already succeeded by now, hence continue-on-error: a push
      # problem must not fail an otherwise published release.
      - name: Point the Homebrew cask at this release
        continue-on-error: true
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/update-cask.cjs "$VERSION" release
          if git diff --quiet -- Casks/ovio.rb; then
            echo "Casks/ovio.rb already points at $VERSION."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/ovio.rb
          git commit -m "Point the Homebrew cask at Ovio $VERSION"
          git fetch origin main
          git rebase origin/main || git rebase --abort
          git push origin HEAD:main

  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer (vite)
        run: npm run build

      - name: Build Windows installer
        run: npx electron-builder --win --publish never
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Smoke-check the packaged app
        shell: bash
        run: |
          APP="release/win-unpacked/resources/app.asar"
          [ -f "$APP" ] || { echo "✖ missing asar: $APP"; exit 1; }
          # asar list uses backslashes + CRLF on Windows, so match loosely.
          npx --yes @electron/asar list "$APP" | tr -d '\r' | grep -qi "index.html" \
            || { echo "✖ renderer (index.html) is NOT in the asar — the app would open blank."; exit 1; }
          find release/win-unpacked -name "llama-addon.node" | tr -d '\r' | grep -q "win-x64" \
            || { echo "✖ Windows local AI addon is missing."; exit 1; }
          echo "✔ renderer (index.html) is packaged."

      - name: Upload Windows artifacts
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          gh release view "v$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "v$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "Ovio v$TAG" --generate-notes
          gh release upload "v$TAG" release/*.exe --repo "$GITHUB_REPOSITORY" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer (vite)
        run: npm run build

      - name: Build Linux packages
        run: npx electron-builder --linux --publish never

      - name: Smoke-check the packaged app
        run: |
          APP="release/linux-unpacked/resources/app.asar"
          npx --yes @electron/asar list "$APP" | grep -q "^/dist/index.html$" \
            || { echo "✖ dist/index.html is NOT in the asar — the app would open blank."; exit 1; }
          find release/linux-unpacked -name "llama-addon.node" | grep -q "linux-x64" \
            || { echo "✖ Linux local AI addon is missing."; exit 1; }
          echo "✔ dist/index.html is packaged."

      - name: Upload Linux artifacts
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          gh release view "v$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "v$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "Ovio v$TAG" --generate-notes
          gh release upload "v$TAG" release/*.AppImage release/*.deb \
            --repo "$GITHUB_REPOSITORY" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
