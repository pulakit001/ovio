name: Release

# Publishes the mac build to GitHub Releases.
#
# Two modes, automatic:
#  - Secrets present (MAC_CSC_LINK + Apple creds) → build is Developer-ID
#    signed AND notarized, then verified with a hard gate before upload.
#    Users get NO Gatekeeper dialog.
#  - No secrets → ad-hoc signed build is published as today. Users see the
#    one-time "Apple could not verify" dialog and bypass via System Settings
#    → Privacy & Security → Open Anyway (documented in README + the in-app
#    updater popup). This stays honest: CI never CLAIMS notarization it
#    didn't do.
#
# Single build → verify → upload with gh CLI (no second electron-builder run,
# which would overwrite the signed app).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build, sign (and notarize if secrets exist)
        # GitHub sets missing secrets as EMPTY strings; electron-builder treats
        # an empty CSC_LINK as a file path and fails. Unset the empties first.
        run: |
          [ -z "$CSC_LINK" ] && unset CSC_LINK || true
          [ -z "$CSC_KEY_PASSWORD" ] && unset CSC_KEY_PASSWORD || true
          [ -z "$APPLE_ID" ] && unset APPLE_ID || true
          [ -z "$APPLE_APP_SPECIFIC_PASSWORD" ] && unset APPLE_APP_SPECIFIC_PASSWORD || true
          [ -z "$APPLE_TEAM_ID" ] && unset APPLE_TEAM_ID || true
          npx electron-builder --mac --publish never
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Verify signing (hard gate when a cert is configured)
        # The gate needs to know whether a cert was SUPPOSED to be used. A
        # secret's presence can't be tested in `if`, so detect it here.
        run: |
          if [ -n "$CSC_LINK" ]; then
            export REQUIRE_NOTARIZED=1
          fi
          node scripts/verify-release-signing.cjs
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}

      - name: Upload artifacts to the release
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          gh release view "v$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "v$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "Ovio v$TAG — for macOS" --generate-notes
          gh release upload "v$TAG" \
            release/Ovio-mac.dmg release/Ovio-mac.zip release/latest-mac.yml \
            --repo "$GITHUB_REPOSITORY" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
