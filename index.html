@keyframes ovioFadeIn {
  from { opacity: 0; }
  to { opacity: 1; }

  to { opacity: 1; transform: translateY(0); }
}
@keyframes ovioFadeDown {
  from { opacity: 0; transform: translateY(-8px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes ovioPopIn {
  from { opacity: 0; transform: scale(0.62); }
  to { opacity: 1; transform: scale(1); }
}
@keyframes ovioScaleIn {
  from { opacity: 0; transform: scale(0.94); }
  to { opacity: 1; transform: scale(1); }
}
@keyframes ovioSlideLeft {
  from { opacity: 0; transform: translateX(26px); }
  to { opacity: 1; transform: translateX(0); }
}
@keyframes ovioSlideRight {
  from { opacity: 0; transform: translateX(-26px); }
  to { opacity: 1; transform: translateX(0); }
}
@keyframes ovioViewIn {
  from { opacity: 0; transform: translateY(9px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes ovioViewSwapA {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes ovioViewSwapB {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes ovioTabIn {
  from { opacity: 0; transform: translateY(7px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes ovioStepIn {
  from { opacity: 0; transform: translateY(18px) scale(0.97); filter: blur(6px); }
  to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
}
/* Signature entrance: rise from blur — cinematic, used for hero blocks. */
@keyframes ovioRiseIn {
  from { opacity: 0; transform: translateY(26px) scale(0.96); filter: blur(10px); }
  to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
}
@keyframes ovioRingPulse {
  0% { transform: scale(1); opacity: 0.6; }
  100% { transform: scale(1.55); opacity: 0; }
}
@keyframes ovioPulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
@keyframes ovioBlink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.2; }
}
@keyframes ovioSpin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}
@keyframes ovioGrowBar {
  from { transform: scaleY(0.35); opacity: 0; }
  to { transform: scaleY(1); opacity: 1; }
}
@keyframes ovioRecordOn {
  0% { transform: scale(0.55); opacity: 0; }
  45% { transform: scale(1.12); opacity: 1; }
  100% { transform: scale(1); opacity: 1; }
}
@keyframes ovioRecordOff {
  0% { transform: scale(1.18); opacity: 0; }
  60% { transform: scale(0.94); opacity: 1; }
  100% { transform: scale(1); opacity: 1; }
}
@keyframes ovioChatInUser {
  from { opacity: 0; transform: translateX(16px) scale(0.97); }
  to { opacity: 1; transform: translateX(0) scale(1); }
}
@keyframes ovioChatInBot {
  from { opacity: 0; transform: translateX(-16px) scale(0.97); }
  to { opacity: 1; transform: translateX(-0) scale(1); }
}
@keyframes ovioDots {
  0%, 80%, 100% { transform: translateY(0); opacity: 0.35; }
  40% { transform: translateY(-3px); opacity: 1; }
}
@keyframes ovioBarSlide {
  0% { transform: translateX(-110%); }
  100% { transform: translateX(300%); }
}
@keyframes ovioShimmer {
  0% { background-position: -220% 0; }
  100% { background-position: 220% 0; }
}
@keyframes ovioFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-5px); }
}
@keyframes ovioFlowDash {
  to { stroke-dashoffset: -28; }
}
@keyframes ovioSettingsIn {
  from { opacity: 0; transform: translateY(14px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes ovioSettingsOut {
  from { opacity: 1; transform: translateY(0); }
  to { opacity: 0; transform: translateY(14px); }
}
@keyframes ovioOverlayIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
@keyframes ovioOverlayOut {
  from { opacity: 1; }
  to { opacity: 0; }
}
@keyframes ovioFlyOut {
  from { opacity: 1; transform: translateY(0) scale(1); }
  to { opacity: 0; transform: translateY(-10px) scale(0.9); }
}
@keyframes ovioToastIn {
  from { opacity: 0; transform: translate(-50%, 10px) scale(0.96); }
  to { opacity: 1; transform: translate(-50%, 0) scale(1); }
}
@keyframes ovioFadeOut {
  from { opacity: 1; }
  to { opacity: 0; }
}
/* Blue flash for saved/updated highlights (was warm beige in the light theme). */
@keyframes ovioFlash {
  0% { background-color: rgba(198,245,95,0.28); }
  100% { background-color: transparent; }
}
/* ---- New dark-vocabulary keyframes ---- */
/* The hero orb breathes: outer glow swells and settles. */
@keyframes ovioGlowBreathe {
  0%, 100% { box-shadow: 0 0 60px 12px rgba(198,245,95,0.42), 0 0 160px 40px rgba(198,245,95,0.16), inset 0 0 40px rgba(255,255,255,0.12); }
  50% { box-shadow: 0 0 90px 22px rgba(198,245,95,0.55), 0 0 220px 60px rgba(198,245,95,0.26), inset 0 0 48px rgba(255,255,255,0.16); }
}
/* The orb levitates — slow, weightless drift. */
@keyframes ovioOrbFloat {
  0%, 100% { transform: translateY(0) rotate(0.001deg); }
  50% { transform: translateY(-14px) rotate(0.001deg); }
}
/* Organic blob morph for the orb silhouette. */
@keyframes ovioOrbMorph {
  0%, 100% { border-radius: 44% 56% 52% 48% / 48% 46% 54% 52%; }
  33% { border-radius: 56% 44% 46% 54% / 52% 56% 44% 48%; }
  66% { border-radius: 48% 52% 58% 42% / 44% 50% 50% 56%; }
}
/* Ambient light drifting across the page background. */
@keyframes ovioWaveFlow {
  0%, 100% { background-position: 50% -10%; }
  50% { background-position: 52% 0%; }
}
/* Recording indicator: halo pulse. */
@keyframes ovioHalo {
  0% { transform: scale(1); opacity: 0.55; }
  100% { transform: scale(2.1); opacity: 0; }
}
/* Text shimmer for loading headlines. */
@keyframes ovioTextShimmer {
  0% { opacity: 0.45; }
  50% { opacity: 1; }
  100% { opacity: 0.45; }
}
/* Marquee-free sliding underline for nav pills. */
@keyframes ovioNavGlow {
  0%, 100% { box-shadow: 0 0 0 1px rgba(86,120,154,0.5); }
  50% { box-shadow: 0 0 0 1px rgba(215,255,119,0.75); }
}

@keyframes ovioLibraryEnter {
  from { opacity: 0; transform: translateY(12px); filter: blur(4px); }
  to { opacity: 1; transform: translateY(0); filter: blur(0); }
}
@keyframes ovioWave {
  0%, 60%, 100% { transform: rotate(0deg); }
  10% { transform: rotate(16deg); }
  20% { transform: rotate(-8deg); }
  30% { transform: rotate(14deg); }
  40% { transform: rotate(-4deg); }
  50% { transform: rotate(10deg); }
}
.library-wave {
  display: inline-block;
  transform-origin: 70% 75%;
  animation: ovioWave 2.4s ease-in-out 500ms 2 both;
  cursor: default;
}
.library-wave:hover { animation: ovioWave 1.6s ease-in-out infinite; }
.library-search-tray {
  border-radius: 24px;
  padding: 9px;
  display: flex;
  flex-direction: column;
  gap: 9px;
}
.library-chip {
  appearance: none;
  border: none;
  border-radius: 12px;
  padding: 0 14px;
  height: 36px;
  max-width: 240px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-family: inherit;
  font-size: 12.5px;
  font-weight: 560;
  cursor: pointer;
  transition: background 160ms ease, color 160ms ease, transform 180ms cubic-bezier(.16,1,.3,1);
}
.library-chip:active { transform: scale(0.97); }
.library-search-bar {
  appearance: none;
  width: 100%;
  height: 62px;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 0 9px;
  border-radius: 18px;
  margin: 0;
  box-sizing: border-box;
  transition: border-color 180ms ease, box-shadow 180ms ease;
}
.library-search-bar:focus-within { border-color: var(--ovio-border-strong) !important; }
.library-ask-input {
  flex: 1;
  min-width: 0;
  height: 100%;
  border: none;
  outline: none;
  background: transparent;
  font-family: inherit;
  font-size: 15px;
  font-weight: 450;
}
.library-ask-input::placeholder { color: var(--ovio-text); opacity: 0.42; }
.library-ask-ghost {
  width: 32px; height: 32px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  border: none; border-radius: 9px; background: transparent; cursor: pointer;
  transition: background 150ms ease, color 150ms ease;
}
.library-ask-ghost:hover { background: var(--ovio-surface2); color: var(--ovio-text) !important; }
@keyframes ovioSpin { to { transform: rotate(360deg); } }
.library-spinner {
  width: 15px; height: 15px; border-radius: 999px;
  border: 2px solid currentColor; border-top-color: transparent;
  animation: ovioSpin 700ms linear infinite;
}
@keyframes ovioShimmer { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
.library-skeleton { display: block; height: 11px; border-radius: 6px; animation: ovioShimmer 1.3s ease-in-out infinite; }
.library-answer {
  border-radius: 16px;
  padding: 18px 20px 16px;
  animation: ovioLibraryEnter 380ms cubic-bezier(.16,1,.3,1) both;
}
.library-cite {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 17px; height: 17px; padding: 0 4px; margin: 0 1px;
  border: none; border-radius: 5px; vertical-align: 2px;
  font-family: inherit; font-size: 10px; font-weight: 650; cursor: pointer;
  transition: color 150ms ease;
}
.library-cite:hover { color: var(--ovio-text) !important; }
.library-source {
  display: inline-flex; align-items: center; gap: 7px; max-width: 260px;
  height: 30px; padding: 0 11px; border-radius: 9px; background: transparent;
  font-family: inherit; font-size: 12px; font-weight: 550; cursor: pointer;
  transition: border-color 150ms ease, color 150ms ease, background 150ms ease;
}
.library-source:hover { border-color: var(--ovio-border-strong) !important; color: var(--ovio-text) !important; background: var(--ovio-surface2); }
.library-chip:focus-visible,
.library-cite:focus-visible,
.library-source:focus-visible,
.library-ask-ghost:focus-visible {
  outline: 2px solid var(--ovio-text);
  outline-offset: 2px;
}
.library-project-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
  gap: 16px;
}
.library-project-card > * {
  width: 100%;
  box-sizing: border-box;
  min-width: 0;
}
.library-folder-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 14px;
}
.library-project-card {
  appearance: none;
  width: 100%;
  min-width: 0;
  min-height: 236px;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  text-align: left;
  color: var(--ovio-text);
  background: var(--ovio-surface);
  border: 1px solid var(--ovio-border);
  border-radius: 16px;
  padding: 0;
  overflow: hidden;
  cursor: pointer;
  font-family: inherit;
  transition: transform 220ms cubic-bezier(.16,1,.3,1), border-color 180ms ease, background 180ms ease;
}
.library-project-card:hover {
  transform: translateY(-3px);
  border-color: var(--ovio-border-strong);
  background: var(--ovio-surface2);
}
.library-project-card:focus-visible,
.library-back:focus-visible,
.library-icon-button:focus-visible,
.library-recording-main:focus-visible,
.library-recording-actions:focus-visible,
.library-action:focus-visible,
.library-more:focus-visible {
  outline: 2px solid var(--ovio-text);
  outline-offset: 3px;
}
.library-project-card:hover .library-project-arrow { transform: translate(2px, -2px); color: var(--ovio-text); }
.library-project-arrow { transition: transform 180ms cubic-bezier(.16,1,.3,1), color 180ms ease; }
.library-project-edit { opacity: 0; }
.library-project-card:hover .library-project-edit,
.library-project-card:focus-within .library-project-edit { opacity: 1; }
@media (hover: none) {
  .library-project-edit { opacity: 1; }
}
.library-project-rename {
  width: 100%;
  box-sizing: border-box;
  margin: -3px 0;
  padding: 3px 8px;
  border: 1px solid var(--ovio-border-strong);
  border-radius: 8px;
  background: var(--ovio-surface2);
  color: var(--ovio-text);
  font-family: inherit;
  font-size: 19px;
  font-weight: 620;
  letter-spacing: -0.022em;
  line-height: 1.22;
  outline: none;
  transition: border-color 160ms ease;
}
.library-project-rename:focus { border-color: var(--ovio-text); }
.library-folder-card {
  background: var(--ovio-surface);
  border: 1px solid var(--ovio-border);
  border-radius: 16px;
  overflow: hidden;
  animation: ovioLibraryEnter 440ms cubic-bezier(.16,1,.3,1) both;
}
.library-folder-head { transition: background 160ms ease; }
.library-folder-head:hover { background: var(--ovio-surface2); }
.library-recording {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 8px;
  border-radius: 10px;
  padding: 0 10px;
  transition: background 150ms ease;
}
.library-recording:hover { background: var(--ovio-surface2); }
.library-recording-main {
  min-width: 0;
  flex: 1;
  display: flex;
  align-items: center;
  gap: 11px;
  border: none;
  background: transparent;
  color: inherit;
  padding: 9px 0;
  text-align: left;
  cursor: pointer;
  font-family: inherit;
}
.library-recording .library-recording-actions { opacity: 0; transition: opacity 150ms ease; }
.library-recording:hover .library-recording-actions,
.library-recording:focus-within .library-recording-actions { opacity: 1; }
.library-icon-button,
.library-action,
.library-back,
.library-more {
  font-family: inherit;
  transition: color 150ms ease, border-color 150ms ease, background 150ms ease, transform 180ms cubic-bezier(.16,1,.3,1);
}
.library-icon-button:hover,
.library-action:hover,
.library-back:hover { color: var(--ovio-text); border-color: var(--ovio-border-strong); background: var(--ovio-surface2); }
.library-more:hover { color: var(--ovio-text); }
@media (max-width: 820px) {
  .library-project-grid,
  .library-folder-grid { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  .library-wave, .library-wave:hover, .library-skeleton { animation: none; }
}
@media (max-width: 620px) {
  .library-page { padding-left: 20px !important; padding-right: 20px !important; }
  .library-greeting-title { font-size: 34px !important; }
  .library-project-card { min-height: 220px; }
  .library-recording-actions { opacity: 1 !important; }
}
