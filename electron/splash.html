<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
  <title>Ovio</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      cursor: default;
    }
    .container {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(178deg, #FBF9F4 0%, #F6F3EC 58%, #F1EDE4 100%);
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 1px 0 rgba(255,255,255,0.8) inset, 0 28px 70px rgba(34,30,23,0.22);
      position: relative;
    }
    /* one quiet glow behind the mark — nothing more */
    .glow {
      position: absolute;
      top: 74px;
      left: 50%;
      width: 260px;
      height: 260px;
      transform: translateX(-50%);
      border-radius: 999px;
      background: radial-gradient(circle, rgba(243,229,217,0.9) 0%, rgba(243,229,217,0) 68%);
      pointer-events: none;
    }

    .mark {
      position: relative;
      width: 86px;
      height: 86px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 2px 4px rgba(34,30,23,0.08), 0 14px 34px rgba(34,30,23,0.20);
      animation: settle 700ms cubic-bezier(0.22, 1, 0.36, 1) 40ms both,
                 float 3.4s ease-in-out 900ms infinite alternate;
    }
    .mark img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .wordmark {
      margin-top: 20px;
      font-size: 27px;
      font-weight: 600;
      letter-spacing: -0.5px;
      color: #221E17;
      animation: rise 600ms cubic-bezier(0.22, 1, 0.36, 1) 160ms both;
    }

    /* hairline rule with a single terracotta knot */
    .rule {
      margin-top: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      animation: rise 600ms cubic-bezier(0.22, 1, 0.36, 1) 260ms both;
    }
    .rule .line { width: 54px; height: 1px; background: #E0D8C8; }
    .rule .dot  { width: 3px;  height: 3px; border-radius: 50%; background: #B4552D; }

    .tagline {
      margin-top: 12px;
      font-size: 10.5px;
      font-weight: 500;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      color: #A89E8E;
      animation: rise 600ms cubic-bezier(0.22, 1, 0.36, 1) 340ms both;
    }

    /* thin, calm progress line */
    .track {
      position: relative;
      margin-top: 30px;
      width: 132px;
      height: 2px;
      border-radius: 1px;
      background: #E7E0D2;
      overflow: hidden;
      animation: rise 600ms cubic-bezier(0.22, 1, 0.36, 1) 440ms both;
    }
    .track .fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 44px;
      border-radius: 1px;
      background: linear-gradient(90deg, rgba(180,85,45,0) 0%, #C9793F 45%, #B4552D 100%);
      animation: sweep 1.6s cubic-bezier(0.45, 0, 0.55, 1) infinite;
    }

    .status {
      margin-top: 14px;
      font-size: 11.5px;
      font-weight: 400;
      color: #8F8676;
      min-height: 15px;
      letter-spacing: 0.1px;
      transition: opacity 240ms ease;
      animation: rise 600ms cubic-bezier(0.22, 1, 0.36, 1) 520ms both;
    }
    .status.swap { opacity: 0; }

    .version {
      position: absolute;
      bottom: 16px;
      font-size: 9.5px;
      font-weight: 500;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: #C9BFAF;
      animation: rise 600ms ease 700ms both;
    }

    @keyframes settle {
      from { opacity: 0; transform: scale(0.92); }
      to   { opacity: 1; transform: scale(1); }
    }
    @keyframes float {
      from { transform: translateY(0); }
      to   { transform: translateY(-4px); }
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes sweep {
      from { left: -44px; }
      to   { left: 132px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="glow"></div>
    <div class="mark"><img src="logo.png" alt="Ovio" /></div>
    <div class="wordmark">Ovio</div>
    <div class="rule"><div class="line"></div><div class="dot"></div><div class="line"></div></div>
    <div class="tagline">Real-time transcription &amp; AI notes</div>
    <div class="track"><div class="fill"></div></div>
    <div class="status" id="status">Getting things ready…</div>
    <div class="version" id="version"></div>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const v = params.get("v");
    if (v) document.getElementById("version").textContent = "v" + v;

    const statuses = [
      "Getting things ready…",
      "Warming up the microphone…",
      "Preparing your workspace…",
      "Almost there…",
    ];
    const el = document.getElementById("status");
    let i = 0;
    setInterval(() => {
      i = (i + 1) % statuses.length;
      el.classList.add("swap");
      setTimeout(() => {
        el.textContent = statuses[i];
        el.classList.remove("swap");
      }, 240);
    }, 1100);
  </script>
</body>
</html>
