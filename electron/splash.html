<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
  <title>Ovio</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      cursor: default;
    }
    .container {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      background: radial-gradient(130% 100% at 50% 0%, #FDFCF8 0%, #F6F3EC 55%, #F1EDE6 100%);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 24px 70px rgba(34,30,23,0.22);
      position: relative;
    }
    /* Soft ambient blobs */
    .blob {
      position: absolute;
      border-radius: 999px;
      filter: blur(40px);
      opacity: 0.55;
      pointer-events: none;
    }
    .blob.b1 { width: 220px; height: 220px; background: #F3E5D9; top: -70px; left: -60px; animation: drift 7s ease-in-out infinite alternate; }
    .blob.b2 { width: 180px; height: 180px; background: #F6EDE0; bottom: -60px; right: -40px; animation: drift 9s ease-in-out infinite alternate-reverse; }
    @keyframes drift {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(24px, 16px) scale(1.12); }
    }

    /* Logo with rotating gradient ring */
    .logo-wrap {
      position: relative;
      width: 112px;
      height: 112px;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: fadeUp 600ms cubic-bezier(0.22,1,0.36,1) 60ms both;
    }
    .ring {
      position: absolute;
      inset: -6px;
      border-radius: 30px;
      background: conic-gradient(from 0deg, #B4552D, #E0A368, #F3E5D9, #B4552D);
      animation: spin 2.6s linear infinite;
      opacity: 0.85;
    }
    .ring::after {
      content: "";
      position: absolute;
      inset: 3px;
      border-radius: 27px;
      background: #F6F3EC;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .logo {
      position: relative;
      width: 96px;
      height: 96px;
      border-radius: 23px;
      overflow: hidden;
      box-shadow: 0 12px 32px rgba(34,30,23,0.20);
      z-index: 1;
    }
    .logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      border-radius: 23px;
    }

    .name {
      margin-top: 18px;
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -0.6px;
      color: #221E17;
      animation: fadeUp 600ms cubic-bezier(0.22,1,0.36,1) 180ms both;
    }
    .tagline {
      margin-top: 5px;
      font-size: 13px;
      font-weight: 400;
      color: #6B6355;
      letter-spacing: 0.1px;
      animation: fadeUp 600ms cubic-bezier(0.22,1,0.36,1) 300ms both;
    }

    /* Waveform loader — echoes the live recorder */
    .wave {
      margin-top: 26px;
      display: flex;
      align-items: center;
      gap: 4px;
      height: 26px;
      animation: fadeUp 600ms cubic-bezier(0.22,1,0.36,1) 420ms both;
    }
    .wave span {
      width: 4px;
      border-radius: 2px;
      background: linear-gradient(180deg, #C9793F, #B4552D);
      animation: bounce 1.1s ease-in-out infinite;
    }
    .wave span:nth-child(1) { animation-delay: 0.00s; }
    .wave span:nth-child(2) { animation-delay: 0.12s; }
    .wave span:nth-child(3) { animation-delay: 0.24s; }
    .wave span:nth-child(4) { animation-delay: 0.36s; }
    .wave span:nth-child(5) { animation-delay: 0.48s; }
    .wave span:nth-child(6) { animation-delay: 0.36s; }
    .wave span:nth-child(7) { animation-delay: 0.24s; }
    .wave span:nth-child(8) { animation-delay: 0.12s; }
    .wave span:nth-child(9) { animation-delay: 0.00s; }
    @keyframes bounce {
      0%, 100% { height: 6px; opacity: 0.55; }
      50%      { height: 24px; opacity: 1; }
    }

    .status {
      margin-top: 16px;
      font-size: 11.5px;
      font-weight: 500;
      color: #A89E8E;
      min-height: 15px;
      letter-spacing: 0.2px;
      transition: opacity 250ms ease;
      animation: fadeUp 600ms cubic-bezier(0.22,1,0.36,1) 520ms both;
    }
    .status.swap { opacity: 0; }

    .version {
      position: absolute;
      bottom: 14px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.6px;
      color: #C9BFAF;
      animation: fadeUp 600ms ease 700ms both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="logo-wrap">
      <div class="ring"></div>
      <div class="logo"><img src="logo.png" alt="Ovio" /></div>
    </div>
    <div class="name">Ovio</div>
    <div class="tagline">Real-time transcription &amp; AI notes</div>
    <div class="wave">
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
    </div>
    <div class="status" id="status">Getting things ready…</div>
    <div class="version">v1.1.0</div>
  </div>
  <script>
    const statuses = [
      "Getting things ready…",
      "Warming up the microphone…",
      "Preparing your workspace…",
      "Almost there…",
    ];
    const el = document.getElementById("status");
    let i = 0;
    setInterval(() => {
      i = (i + 1) % statuses.length;
      el.classList.add("swap");
      setTimeout(() => {
        el.textContent = statuses[i];
        el.classList.remove("swap");
      }, 250);
    }, 1100);
  </script>
</body>
</html>
